spring.application.name=rag-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:knowledge_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:knowledge_platform}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=rag_service

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public

# WebFlux is the primary web stack for this module because chat responses are
# streamed. Servlet-based modules (document-service, indexing-service) are
# unaffected.
spring.main.web-application-type=reactive

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# --- RAG pipeline providers (offline stubs by default; no API keys required) ---
# provider = stub (offline) | openai (platform.openai.com) | azure (placeholder)
knowledge-platform.embedding.provider=${EMBEDDING_PROVIDER:openai}
knowledge-platform.embedding.dimensions=${EMBEDDING_DIMENSIONS:768}
knowledge-platform.llm.provider=${LLM_PROVIDER:openai}
knowledge-platform.rag.top-k=${RAG_TOP_K:5}
knowledge-platform.rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:6000}
# URL template for links attached to cited documents; {documentId} is substituted.
knowledge-platform.rag.document-link-base=${DOCUMENT_LINK_BASE:http://localhost:8080/api/v1/documents/{documentId}}
# The grounding/guardrail system prompt has a hardened built-in default (see
# RagProperties.DEFAULT_SYSTEM_PROMPT). Override here or via SYSTEM_PROMPT if needed.
knowledge-platform.rag.system-prompt=${SYSTEM_PROMPT:}

# --- OpenAI (platform.openai.com) — used only when provider=openai ---
# The key is intentionally empty here; supply it via the OPENAI_API_KEY env var.
# NEVER commit a real key. text-embedding-3-* supports Matryoshka truncation, so
# 768 matches the pgvector column; for retrieval to work indexing-service must
# embed chunks with the SAME model + dimensions.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=${OPENAI_EMBEDDING_DIMENSIONS:768}

# --- Azure OpenAI placeholders (empty by default; set to enable the azure provider) ---
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_CHAT_DEPLOYMENT:}
spring.ai.azure.openai.embedding.options.deployment-name=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:}
