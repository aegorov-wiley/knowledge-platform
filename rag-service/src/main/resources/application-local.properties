# Local profile: run rag-service against real OpenAI (platform.openai.com).
# Activate with: SPRING_PROFILES_ACTIVE=local ../mvnw spring-boot:run
#
# Provide the API key ONLY via the environment — never commit it:
#   export OPENAI_API_KEY=sk-...
# The empty default below keeps the key out of source control.
spring.ai.openai.api-key=${OPENAI_API_KEY:}

knowledge-platform.llm.provider=openai
knowledge-platform.embedding.provider=openai

# NOTE: retrieval only works if indexing-service embedded the documents with the
# SAME model + dimensions (text-embedding-3-small @ 768). Re-index existing docs
# with the openai provider before querying — see plan.md.
