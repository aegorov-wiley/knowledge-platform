{{- if eq .Values.secrets.mode "plain" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kp.fullname" . }}-secrets
  labels:
    {{- include "kp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- else if eq .Values.secrets.mode "external" }}
# Requires the External Secrets Operator (ESO) and a (Cluster)SecretStore that
# authenticates to AWS Secrets Manager (via IRSA or the node instance role).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kp.fullname" . }}-secrets
  labels:
    {{- include "kp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStoreRef }}
    kind: {{ .Values.secrets.external.kind }}
  target:
    name: {{ include "kp.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $k, $ref := .Values.secrets.external.remoteRef }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $ref.key }}
        property: {{ $ref.property }}
    {{- end }}
{{- end }}
