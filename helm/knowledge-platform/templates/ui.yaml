{{- if .Values.ui.enabled }}
{{- $component := "ui" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ $component }}-nginx
  labels:
    {{- include "kp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $component }}
data:
  default.conf: |
    # Same-origin reverse proxy: UI + both web APIs behind one nginx (no CORS).
    # Upstreams are the release-scoped ClusterIP service names.
    server {
        listen 80;
        server_name _;
        client_max_body_size 60m;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/v1/documents {
            proxy_pass http://{{ .Release.Name }}-document-service:{{ .Values.documentService.port }};
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_request_buffering off;
        }

        location /api/v1/rag {
            proxy_pass http://{{ .Release.Name }}-rag-service:{{ .Values.ragService.port }};
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $component }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "kp.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx: {{ printf "%s-%v-%v" .Release.Name .Values.documentService.port .Values.ragService.port | sha256sum }}
      labels:
        {{- include "kp.labels" . | nindent 8 }}
        {{- include "kp.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.ui.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-{{ $component }}-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "kp.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
