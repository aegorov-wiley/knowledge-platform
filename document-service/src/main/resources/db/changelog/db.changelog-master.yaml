databaseChangeLog:
  - changeSet:
      id: 001-create-documents-table
      author: aegorov
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: documents
            indexName: idx_documents_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

  - changeSet:
      id: 002-create-outbox-events-table
      author: aegorov
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: claimed_by
                  type: VARCHAR(128)
              - column:
                  name: claimed_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: outbox_events
            baseColumnNames: aggregate_id
            referencedTableName: documents
            referencedColumnNames: id
            constraintName: fk_outbox_events_document_id
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_unpublished
            columns:
              - column:
                  name: published_at
              - column:
                  name: claimed_until
              - column:
                  name: created_at
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_aggregate_created_at
            columns:
              - column:
                  name: aggregate_id
              - column:
                  name: created_at

  - changeSet:
      id: 003-add-documents-file-name-unique-constraint
      author: aegorov
      changes:
        - addUniqueConstraint:
            tableName: documents
            columnNames: file_name
            constraintName: uq_documents_file_name

  - changeSet:
      id: 004-add-documents-file-name-lookup-index
      author: aegorov
      preConditions:
        onFail: MARK_RAN
        not:
          indexExists:
            tableName: documents
            indexName: idx_documents_file_name_lookup
      changes:
        - createIndex:
            tableName: documents
            indexName: idx_documents_file_name_lookup
            columns:
              - column:
                  name: file_name
