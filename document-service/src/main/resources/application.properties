spring.application.name=knowledge-platform

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:knowledge_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:knowledge_platform}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

knowledge-platform.storage.local.root=${KNOWLEDGE_PLATFORM_STORAGE_ROOT:./data/storage}
knowledge-platform.documents.max-size=50MB
knowledge-platform.retry.create-document.max-attempts=3
knowledge-platform.retry.create-document.delay-ms=100
knowledge-platform.retry.create-document.max-delay-ms=1000
knowledge-platform.retry.create-document.multiplier=2.0
knowledge-platform.kafka.topics.documents-uploaded=knowledge.documents.v1
knowledge-platform.outbox.batch-size=50
knowledge-platform.outbox.claim-timeout=PT1M
knowledge-platform.outbox.publish-delay=PT5S