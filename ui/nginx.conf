# The UI is served by nginx, which also reverse-proxies the two web-facing
# services. Serving the page and the APIs from the SAME origin avoids CORS
# entirely and lets the browser's Basic auth header flow straight through.
server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Document uploads (multipart) -> document-service.
    location /api/v1/documents {
        proxy_pass http://document-service:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
    }

    # RAG chat + search -> rag-service. Streaming NDJSON requires buffering off
    # so DELTA tokens reach the browser as they are produced.
    location /api/v1/rag {
        proxy_pass http://rag-service:8082;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
