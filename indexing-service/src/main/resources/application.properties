spring.application.name=indexing-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:knowledge_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:knowledge_platform}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

knowledge-platform.kafka.topics.documents-uploaded=knowledge.documents.v1
knowledge-platform.kafka.consumer.group-id=indexing-service-v1
knowledge-platform.storage.local.root=${KNOWLEDGE_PLATFORM_STORAGE_ROOT:../document-service/data/storage}
knowledge-platform.chunking.max-chars=1200
knowledge-platform.chunking.overlap-chars=200

# Embeddings: provider=stub (offline default) or ollama. dimensions MUST match
# the document_chunks.embedding pgvector column and the selected model.
knowledge-platform.embedding.provider=${KNOWLEDGE_PLATFORM_EMBEDDING_PROVIDER:stub}
knowledge-platform.embedding.dimensions=768

# Spring AI Ollama (used only when provider=ollama). Requires a local Ollama
# instance with the embedding model pulled: `ollama pull nomic-embed-text`.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.init.pull-model-strategy=never

# Spring AI OpenAI (used only when provider=openai). text-embedding-3-small
# supports Matryoshka dimension truncation, so 768 matches the pgvector column.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.dimensions=${OPENAI_EMBEDDING_DIMENSIONS:768}

